[project]
name = "learn-harlequin"
version = "0.1.0"
description = "A craft beer shop pipeline with DuckDB, Harlequin and dbt, run on a laptop, on AWS Emulator and as a scheduled Fargate job"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.5",
    "faker>=40.38.0",
    "harlequin>=2.13.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
]
