version: 2

models:
  - name: stg_events
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests: [not_null]
      - name: event_type
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - page_view
                  - search
                  - product_view
                  - add_to_cart
                  - checkout_started
                  - purchase
